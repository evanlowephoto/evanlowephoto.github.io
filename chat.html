<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Tiny Tim — Chat</title>
<script type="module">
/* On-device voice input: Whisper tiny.en via transformers.js (no server key, audio never leaves the device). */
import { pipeline } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/+esm";
window.__tinyTimVoicePipeline = pipeline;
</script>
<style>
:root{
--bg:#f2f3f5; --surface:#ffffff; --surface2:#eef0f3; --text:#111318; --muted:#6b7280; --line:#e2e4e8;
--blue:#0a84ff; --gray-bubble:#e9e9ec; --gray-text:#111318;
--shadow:0 20px 50px rgba(0,0,0,.14), 0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
:root{ --bg:#0b0e13; --surface:#161a21; --surface2:#1e242e; --text:#f2f4f7; --muted:#9aa3af; --line:#262c36; --gray-bubble:#262b33; --gray-text:#f2f4f7; --shadow:0 20px 50px rgba(0,0,0,.5); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 48px}
/* PHONE */
.phone-shell{background:var(--surface);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);overflow:hidden}
.chat-header{display:flex;align-items:flex-start;justify-content:center;padding:14px 14px 6px}
.agent{text-align:center;flex:1}
.avatar-wrap{width:112px;height:112px;margin:0 auto}
.avatar-emoji{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;border:1px solid var(--line);background:linear-gradient(135deg,#ffe9c7,#ffd2a6)}
.agent-name{display:inline-block;margin-top:6px;background:var(--surface2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;line-height:1}
.status-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px 12px 4px}
.status-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted);min-height:30px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:0 0 auto}
.status-pill.working .status-dot{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.time-label{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 2px;font-weight:500}
.messages{height:380px;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.msg{max-width:82%;padding:9px 12px;border-radius:18px;font-size:14.5px;line-height:1.4;word-break:break-word}
.msg.in{align-self:flex-start;background:var(--gray-bubble);color:var(--gray-text);border-bottom-left-radius:6px}
.msg.out{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.out a{color:#fff}
.msg.error{align-self:flex-start;background:#fdeceb;color:#8a1f1a;border:1px solid #f3c1bd;border-bottom-left-radius:6px;font-size:13.5px}
@media (prefers-color-scheme: dark){.msg.error{background:#3a1714;color:#ffb4ab;border-color:#5c2a24}}
.msg pre{background:rgba(0,0,0,.16);border-radius:8px;padding:8px 10px;overflow-x:auto;font-size:12.5px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.msg p{margin:0 0 6px}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-left:18px}
/* Picture bubbles */
.pic-bubble{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pic-bubble img{max-width:100%;max-height:260px;border-radius:16px;border-bottom-right-radius:6px;display:block;object-fit:cover;cursor:zoom-in}
.pic-bubble .cap{background:var(--blue);color:#fff;padding:9px 12px;border-radius:18px;border-bottom-right-radius:6px;font-size:14.5px;line-height:1.4;word-break:break-word}
/* Composer */
.thumb-strip{display:flex;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.thumb-strip[hidden]{display:none}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.icon-btn.listening{background:var(--blue);border-color:var(--blue);color:#fff;animation:pulse 1s infinite}
#input{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;max-height:120px;line-height:1.35}
#input:focus{outline:2px solid var(--blue);outline-offset:0}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:.5;cursor:default}
.hint{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 16px 12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone-shell" role="main" aria-label="Chat with Tiny Tim">
    <div class="chat-header">
      <div class="agent">
        <div class="avatar-wrap"><div class="avatar-emoji" role="img" aria-label="Tiny Tim">&#x1F98A;</div></div>
        <div class="agent-name">Tiny Tim</div>
        <div class="status-row">
          <span class="status-pill" id="statusPill"><span class="status-dot"></span><span id="statusText">Ready</span></span>
               </div>
    </div>
    <div class="time-label" id="timeLabel"></div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="thumb-strip" id="thumbStrip" hidden></div>
    <div class="composer">
      <button class="icon-btn" id="attachBtn" title="Attach a picture" aria-label="Attach a picture">&#xFF0B;</button>
      <input type="file" id="fileInput" accept="image/*" hidden>
      <textarea id="input" rows="1" placeholder="Message Tiny Tim&hellip;" aria-label="Message"></textarea>
      <button class="icon-btn" id="micBtn" title="Voice input" aria-label="Voice input">&#x1F3A4;</button>
      <button class="send-btn" id="sendBtn" title="Send" aria-label="Send">&uarr;</button>
    </div>
    <div class="hint">Powered by Llama 4 Scout through a secure proxy &mdash; no downloads, no key needed.</div>
  </div>
</div>
<script>
"use strict";
/* Tiny Tim — Llama-only chat.
   One model only: Llama 4 Scout, served through the owner's Cloudflare
   Worker proxy. No API key lives in this page, visitors never enter a key,
   and no on-device models are offered or loaded. */
const WORKER_URL = "https://echo-chat-llama-proxy.evan996.workers.dev/v1/chat/completions";
const MODEL = "meta-llama/Llama-4-Scout-17B-16E-Instruct";
const SYSTEM_PROMPT = "You are Tiny Tim, a helpful assistant inside a small chat app, powered by Meta's Llama model. Answer clearly and concisely. When the user sends a picture, look at it and describe or answer about what is actually in it. Use Markdown sparingly (short paragraphs, occasional lists or code blocks).";
const HISTORY_LIMIT = 20;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const attachBtn = document.getElementById("attachBtn");
const fileInput = document.getElementById("fileInput");
const micBtn = document.getElementById("micBtn");
const thumbStrip = document.getElementById("thumbStrip");
const statusPill = document.getElementById("statusPill");
const statusText = document.getElementById("statusText");  let pendingImage = null; // JPEG data URL, or null const history = [];      // {role, content} in OpenAI chat format  function setStatus(mode, text) {   statusPill.classList.toggle("working", mode === "working");   statusText.textContent = text; } function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; } function esc(s) {   return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); } /* Tiny Markdown: fenced code blocks, inline code, bold, italic, lists, paragraphs. */ function md(src) {   const blocks = [];   let text = esc(src).replace(/```[a-zA-Z0-9_-]*
?([\s\S]*?)```/g, function (m, code) {     blocks.push("<pre><code>" + code.replace(/^
+|\s+$/g, "") + "</code></pre>");     return "\u0000" + (blocks.length - 1) + "\u0000";   });   text = text.replace(/`([^`
]+)`/g, "<code>$1</code>");   text = text.replace(/\*\*([^*
]+)\*\*/g, "<strong>$1</strong>");   text = text.replace(/(^|[\s(>])\*([^*
]+)\*/g, "$1<em>$2</em>");   const lines = text.split("
");   let html = "", list = null;   const close = function () { if (list) { html += list === "ul" ? "</ul>" : "</ol>"; list = null; } };   for (const line of lines) {     const t = line.trim();     const ph = t.match(/^\u0000(\d+)\u0000$/);     if (ph) { close(); html += blocks[+ph[1]]; continue; }     const ul = t.match(/^[-*]\s+(.*)$/);     const ol = t.match(/^\d+[.)]\s+(.*)$/);     if (ul) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += "<li>" + ul[1] + "</li>"; }     else if (ol) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += "<li>" + ol[1] + "</li>"; }     else if (t === "") { close(); }     else { close(); html += "<p>" + t + "</p>"; }   }   close();   return html || "<p></p>"; }

function addBubble(role, html, cls) {
  const div = document.createElement("div");
  div.className = "msg " + (cls || role);
  div.innerHTML = html;
  messagesEl.appendChild(div);
  scrollDown();
  return div;
}
function addPictureBubble(dataUrl, caption) {
  const div = document.createElement("div");
  div.className = "pic-bubble";
  const img = document.createElement("img");
  img.src = dataUrl;
  img.alt = "Attached picture";
  div.appendChild(img);
  if (caption) {
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = caption;
    div.appendChild(cap);
  }
  messagesEl.appendChild(div);
  scrollDown();
}
function friendlyError(status) {
  if (status === 429) return "Too many requests right now \u2014 please slow down and try again in a bit.";
  if (status === 503) return "The chat service is temporarily unavailable (it may have hit its daily budget). Try again later.";
  if (status === 400) return "That request was rejected. Try a shorter message or a smaller picture.";
  return "Something went wrong reaching Tiny Tim. Please try again.";
}
async function send() {
  const text = inputEl.value.trim();
  if ((!text && !pendingImage) || sendBtn.disabled) return;
  const image = pendingImage;
  pendingImage = null;
  renderThumbs();
  inputEl.value = "";
  autoresize();
  let content;
  if (image) {
    const parts = [];
    if (text) parts.push({ type: "text", text: text });
    parts.push({ type: "image_url", image_url: { url: image } });
    content = parts;
  } else {
    content = text;
  }
  history.push({ role: "user", content: content });
  if (image) addPictureBubble(image, text);
  else addBubble("out", "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>");
  setStatus("working", "Thinking\u2026");
  sendBtn.disabled = true;
  try {
    const payload = {
      model: MODEL,
      messages: [{ role: "system", content: SYSTEM_PROMPT }].concat(history.slice(-HISTORY_LIMIT)),
      temperature: 0.7,
      max_tokens: 1024
    };
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("http" + res.status);
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const reply = msg && msg.content;
    if (typeof reply !== "string" || !reply.trim()) throw new Error("empty");
    history.push({ role: "assistant", content: reply });
    addBubble("in", md(reply));
  } catch (err) {
    const m = /^http(\d+)$/.exec(String(err && err.message));
    addBubble("in", "<p>" + esc(friendlyError(m ? +m[1] : 0)) + "</p>", "error");
  } finally {
    setStatus("idle", "Ready");
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
/* Voice input: on-device Whisper tiny.en via transformers.js. First tap loads
   the model ("Loading voice\u2026"), then records; tap again to stop. The
   recording is transcribed locally and appended to the message box (never
   auto-sent). Audio never leaves the device. */
let voiceTranscriber = null; // Promise for the Whisper pipeline, once loaded
let voiceLoading = false;
let mediaRecorder = null;
let audioChunks = [];
let recording = false;
function loadVoiceModel() {
  if (!voiceTranscriber) {
    voiceTranscriber = (async function () {
      const makePipeline = window.__tinyTimVoicePipeline;
      if (typeof makePipeline !== "function") throw new Error("voice-unavailable");
      return makePipeline("automatic-speech-recognition", "Xenova/whisper-tiny.en");
    })();
  }
  return voiceTranscriber;
}
function setVoiceUI(on) {
  micBtn.classList.toggle("listening", on);
  if (on) setStatus("working", "Listening\u2026");
}
async function blobToMono16k(blob) {
  const bytes = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  try {
    const decoded = await ctx.decodeAudioData(bytes);
    const rate = 16000;
    const offline = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
    const src = offline.createBufferSource();
    src.buffer = decoded;
    src.connect(offline.destination);
    src.start(0);
    const rendered = await offline.startRendering();
    return rendered.getChannelData(0);
  } finally {
    if (ctx.close) ctx.close();
  }
}
function stopRecording() {
  if (mediaRecorder && recording) {
    recording = false;
    try { mediaRecorder.stop(); } catch (e) {}
    if (mediaRecorder.stream) mediaRecorder.stream.getTracks().forEach(function (t) { t.stop(); });
  }
}
async function finishRecording() {
  setVoiceUI(false);
  setStatus("working", "Transcribing\u2026");
  try {
    const blob = new Blob(audioChunks, { type: (mediaRecorder && mediaRecorder.mimeType) || "audio/webm" });
    audioChunks = [];
    const audio = await blobToMono16k(blob);
    const transcriber = await loadVoiceModel();
    const out = await transcriber(audio, { chunk_length_s: 30, stride_length_s: 5 });
    const said = out && out.text ? String(out.text).trim() : "";
    if (said) {
      const cur = inputEl.value.replace(/\s+$/, "");
      inputEl.value = cur ? cur + " " + said : said;
      autoresize();
    }
  } catch (err) {
    addBubble("in", "<p>" + esc("Voice input failed \u2014 please try again.") + "</p>", "error");
  } finally {
    setStatus("idle", "Ready");
    inputEl.focus();
  }
}
async function toggleMic() {
  if (voiceLoading) return;
  if (recording) { stopRecording(); return; }
  if (!voiceTranscriber) {
    voiceLoading = true;
    setStatus("working", "Loading voice\u2026");
    try {
      await loadVoiceModel();
    } catch (err) {
      voiceTranscriber = null;
      voiceLoading = false;
      setStatus("idle", "Ready");
      addBubble("in", "<p>" + esc("Voice input failed to load \u2014 please try again later.") + "</p>", "error");
      return;
    }
    voiceLoading = false;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = function (e) { if (e.data && e.data.size) audioChunks.push(e.data); };
    mediaRecorder.onstop = function () { finishRecording(); };
    mediaRecorder.start();
    recording = true;
    setVoiceUI(true);
  } catch (err) {
    setStatus("idle", "Ready");
    addBubble("in", "<p>" + esc("Microphone is not available \u2014 please allow microphone access and try again.") + "</p>", "error");
  }
}
micBtn.addEventListener("click", toggleMic);
attachBtn.addEventListener("click", function () { fileInput.click(); });
fileInput.addEventListener("change", function () {
  const f = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  if (!f) return;
  const reader = new FileReader();
  reader.onload = function () {
    const img = new Image();
    img.onload = function () {
      const maxDim = 1024;
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * scale));
      h = Math.max(1, Math.round(h * scale));
      const c = document.createElement("canvas");
      c.width = w; c.height = h;
      c.getContext("2d").drawImage(img, 0, 0, w, h);
      let q = 0.85, url = c.toDataURL("image/jpeg", q);
      while (url.length > 2000000 && q > 0.4) { q -= 0.15; url = c.toDataURL("image/jpeg", q); }
      pendingImage = url;
      renderThumbs();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(f);
});
function renderThumbs() {
  thumbStrip.innerHTML = "";
  thumbStrip.hidden = !pendingImage;
  if (!pendingImage) return;
  const d = document.createElement("div");
  d.className = "thumb";
  const img = document.createElement("img");
  img.src = pendingImage;
  img.alt = "Picture to send";
  const x = document.createElement("button");
  x.textContent = "\u00D7";
  x.setAttribute("aria-label", "Remove picture");
  x.addEventListener("click", function () { pendingImage = null; renderThumbs(); });
  d.appendChild(img);
  d.appendChild(x);
  thumbStrip.appendChild(d);
}
function autoresize() {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
}
inputEl.addEventListener("input", autoresize);
inputEl.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
(function init() {
  const d = new Date();
  let h = d.getHours();
  const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  const min = String(d.getMinutes()).padStart(2, "0");
  document.getElementById("timeLabel").textContent = "Today \u00B7 " + h + ":" + min + " " + ap;
  addBubble("in", md("Hi, I'm **Tiny Tim**! Ask me anything \u2014 I now run on **Llama 4 Scout** in the cloud, so there's nothing to download and no key to enter. You can also attach a picture for me to look at."));
  autoresize();
})();
</script>
</body>
</html>
