<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>Tiny Tim — Chat</title>
<style>
:root{
--bg:#f2f3f5; --surface:#ffffff; --surface2:#eef0f3; --text:#111318; --muted:#6b7280; --line:#e2e4e8;
--blue:#0a84ff; --gray-bubble:#e9e9ec; --gray-text:#111318;
--shadow:0 20px 50px rgba(0,0,0,.14), 0 2px 10px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark){
:root{ --bg:#0b0e13; --surface:#161a21; --surface2:#1e242e; --text:#f2f4f7; --muted:#9aa3af; --line:#262c36; --gray-bubble:#262b33; --gray-text:#f2f4f7; --shadow:0 20px 50px rgba(0,0,0,.5); }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html,body{overscroll-behavior-y:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:26px 16px 48px}
/* PHONE */
.phone-shell{background:var(--surface);border:1px solid var(--line);border-radius:38px;box-shadow:var(--shadow);overflow:hidden}
.chat-header{display:flex;align-items:flex-start;justify-content:center;padding:14px 14px 6px}
.agent{text-align:center;flex:1}
.avatar-wrap{width:112px;height:112px;margin:0 auto}
.avatar-img{width:112px;height:112px;border-radius:50%;object-fit:cover;border:1px solid var(--line);display:block;margin:0 auto}

.avatar-emoji{width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:58px;border:1px solid var(--line);background:linear-gradient(135deg,#ffe9c7,#ffd2a6)}
.agent-name{display:inline-block;margin-top:6px;background:var(--surface2);border:1px solid var(--line);padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;line-height:1}
.status-row{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:8px 12px 4px}
.status-pill{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted);min-height:30px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:0 0 auto}
.status-pill.working .status-dot{background:var(--blue);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
.time-label{text-align:center;font-size:11px;color:var(--muted);margin:6px 0 2px;font-weight:500}
.messages{height:380px;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;scroll-behavior:smooth;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.msg{max-width:82%;padding:9px 12px;border-radius:18px;font-size:14.5px;line-height:1.4;word-break:break-word}
.msg.in{align-self:flex-start;background:var(--gray-bubble);color:var(--gray-text);border-bottom-left-radius:6px}
.msg.out{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.out a{color:#fff}
.msg.error{align-self:flex-start;background:#fdeceb;color:#8a1f1a;border:1px solid #f3c1bd;border-bottom-left-radius:6px;font-size:13.5px}
@media (prefers-color-scheme: dark){.msg.error{background:#3a1714;color:#ffb4ab;border-color:#5c2a24}}
.msg pre{background:rgba(0,0,0,.16);border-radius:8px;padding:8px 10px;overflow-x:auto;font-size:12.5px;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.msg code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.msg p{margin:0 0 6px}
.msg p:last-child{margin-bottom:0}
.msg ul,.msg ol{margin:4px 0 6px;padding-left:18px}
/* Picture bubbles */
.pic-bubble{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pic-bubble img{max-width:100%;max-height:260px;border-radius:16px;border-bottom-right-radius:6px;display:block;object-fit:cover;cursor:zoom-in}
.pic-bubble .cap{background:var(--blue);color:#fff;padding:9px 12px;border-radius:18px;border-bottom-right-radius:6px;font-size:14.5px;line-height:1.4;word-break:break-word}
/* Composer */
.thumb-strip{display:flex;gap:8px;padding:10px 12px 0;flex-wrap:wrap}
.thumb-strip[hidden]{display:none}
.thumb{position:relative;width:72px;height:72px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:12px;cursor:pointer;line-height:1}
.composer{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
#input{flex:1;border:1px solid var(--line);background:var(--surface2);color:var(--text);border-radius:999px;padding:10px 14px;font-size:15px;font-family:inherit;resize:none;max-height:120px;line-height:1.35}
#input:focus{outline:2px solid var(--blue);outline-offset:0}
.send-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:18px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.send-btn:disabled{opacity:.5;cursor:default}
.hint{font-size:11.5px;color:var(--muted);text-align:center;padding:8px 16px 12px}
.composer{position:relative}
.attach-menu{position:absolute;left:12px;bottom:62px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:4px;z-index:5}
.attach-menu[hidden]{display:none}
.attach-menu button{text-align:left;padding:9px 12px;border:none;background:transparent;color:var(--text);font:inherit;font-size:14px;cursor:pointer;border-radius:8px}
.attach-menu button:hover{background:var(--surface2)}
/* Attach-fix: file inputs must NOT be display:none. iOS/WebKit treats a
   programmatic .click() on a display:none file input as untrusted and falls
   back to its own source sheet. A 1px, fully transparent input stays in
   layout, so the click from the custom menu keeps its user-gesture trust. */
.file-input-visually-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.speak-row{margin-top:6px}
.speak-btn{font:inherit;font-size:12px;line-height:1;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.speak-btn.playing{background:var(--surface2);color:var(--text)}
</style>
</head>

function md(src) {

    return "\u0000" + (blocks.length - 1) + "\u0000";
  });
  // Restore ONLY safe subscript/superscript tags (everything else stays escaped).
  text = text.replace(/&lt;(\/?)(sub|sup)&gt;/g, "<$1$2>");
  text = text.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  text = text.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  text = text.replace(/(^|[\s(>])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  const lines = text.split("\n");
  let html = "", list = null;
  const close = function () { if (list) { html += list === "ul" ? "</ul>" : "</ol>"; list = null; } };
  for (const line of lines) {
    const t = line.trim();
    const ph = t.match(/^\u0000(\d+)\u0000$/);
    if (ph) { close(); html += blocks[+ph[1]]; continue; }
    const ul = t.match(/^[-*]\s+(.*)$/);
    const ol = t.match(/^\d+[.)]\s+(.*)$/);
    if (ul) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += "<li>" + ul[1] + "</li>"; }
    else if (ol) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += "<li>" + ol[1] + "</li>"; }
    else if (/^#{1,6}\s+/.test(t)) { const lvl = t.match(/^#+/)[0].length; close(); html += "<h" + lvl + ">" + t.replace(/^#+\s+/, "") + "</h" + lvl + ">"; }
    else if (t === "") { close(); }
    else { close(); html += "<p>" + t + "</p>"; }
  }

}

/* ---- Voice playback, sanoTTS ENGINE ----

   and GitHub Pages cannot set COOP/COEP, which threaded WASM needs for
   SharedArrayBuffer. WASM runtime ~2.7 MB uncompressed (~700 KB gzipped
   over the wire per the project README).
   Voice: hfc, English, gender undocumented — ear-judgement test only, do NOT label male
   (SCOREQ 4.13 / UTMOS 4.10 in the project README), ~3 MB fp16 / 5.6 MB fp32.

   default speaking rate (longer phoneme durations), per the sanotts-web API.
   HONEST FLAG: sanoTTS publishes NO documented male English voice.
   kristin is female-named, hfc/heart/heart-nano gender is undocumented
   in the README/demo. This build therefore does NOT meet Evan's
   "male voice, because it's Tiny Tim" requirement as documented; it is a
   technical proof that a non-ONNX engine can speak at all. Do NOT relabel
   hfc as male. Parent/Evan must decide whether to accept hfc
   unlabelled, or reject sanoTTS on voice grounds.

   hosted demo https://ampixa.github.io/sanoTTS/), tts.synthesize(text,

   tts.loadVoice(key) to pre-download. Samples are converted here to a WAV

   First tap downloads the WASM runtime + hfc voice once, then caches. */
const SANO_VOICE = "hfc";
const SANO_LENGTH_SCALE = 1.50;

function loadVoiceEngine() {
  if (sanoTts) return Promise.resolve(sanoTts);
  if (!sanoPromise) {
    const failures = [];
    function trySource(i) {
      if (i >= SANO_SOURCES.length) return Promise.reject(new Error("the sanoTTS voice library failed to load \u2014 " + failures.join(" \u00b7 ")));
      const url = SANO_SOURCES[i];
      return withTimeout(Promise.resolve().then(function () { return import(url); }), 60000, "sanoTTS library import (" + url + ")")
        .then(function (mod) {
          const SanoTTS = mod && (mod.SanoTTS || (mod.default && mod.default.SanoTTS));
          if (!SanoTTS || typeof SanoTTS.load !== "function") throw new Error("the module loaded but exposed no SanoTTS.load function");

            }
            return tts;

        .catch(function (err) { failures.push(url + " \u2192 " + (err && err.message ? err.message : err)); return trySource(i + 1); });
    }
    sanoPromise = trySource(0).then(function (tts) { sanoTts = tts; return tts; });
    sanoPromise.catch(function () { if (sanoPromise) sanoPromise = null; });

}
function generateWithTimeout(tts, text, ms) {
  return withTimeout(Promise.resolve().then(function () { return tts.synthesize(text, { voice: SANO_VOICE, lengthScale: SANO_LENGTH_SCALE }); }), ms, "sanoTTS generate").then(function (out) {
    if (!out || !out.samples || !out.samples.length) throw new Error("the voice model returned no audio");
    return wavBlobFromSamples(out.samples, out.sampleRate);
  });
}

function cleanForSpeech(text) {
  return String(text || "")
    .replace(/```[\s\S]*?```/g, " code block omitted. ")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/<sub>([^<]*)<\/sub>/g, " sub $1")
    .replace(/<sup>([^<]*)<\/sup>/g, " super $1")
    .replace(/<[^>]+>/g, " ")
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1")
    .replace(/[*_#>]/g, " ")
    .replace(/\s+/g, " ").trim();
}
function splitForSpeech(text) {
  const parts = []; let cur = "";
  const sentences = String(text).match(/[^.!?]+[.!?]*\s*/g) || [String(text)];
  sentences.forEach(function (sent) {
    if (cur && (cur + " " + sent).trim().length > 240) { parts.push(cur.trim()); cur = sent; }
    else cur = cur ? cur + " " + sent : sent;
  });
  if (cur.trim()) parts.push(cur.trim());
  return parts.length ? parts : [String(text)];
}
function addSpeakButton(bubble, rawText) {
  const clean = cleanForSpeech(rawText);
  if (!clean) return;
  const row = document.createElement("div"); row.className = "speak-row";
  const btn = document.createElement("button"); btn.type = "button"; btn.className = "speak-btn";
  btn.textContent = "Tap here to listen"; btn.setAttribute("aria-label", "Tap here to listen");
  btn.addEventListener("click", function () {
    unlockAudio(); getAudioCtx(); // must run synchronously inside this tap
    if (activeSpeakBtn === btn) { stopSpeaking(); return; }
    stopSpeaking(); activeSpeakBtn = btn; btn.classList.add("playing"); btn.textContent = "Loading voice…";
    const run = speechRun;
    loadVoiceEngine().then(function (engine) {
      if (run !== speechRun) return;
      btn.textContent = "Stop";
      const chunks = splitForSpeech(clean); let chain = Promise.resolve();
      chunks.forEach(function (chunk, chunkIndex) {
        chain = chain.then(function () {
          if (run !== speechRun) return;
          setVoiceDiag("Generating chunk " + (chunkIndex + 1) + "/" + chunks.length + "… started " + fmtTime(new Date()) + ". If this passes 30 seconds it will report generate timed out instead of hanging on Stop.");
          return generateWithTimeout(engine, chunk, 30000).then(function (blob) {
            if (run !== speechRun) return;
            if (!blob) throw new Error("the voice model returned no audio");
            return playAudioBlob(blob, run, chunk, chunkIndex + 1, chunks.length);
          });
        });
      });
      return chain.then(function () { if (run === speechRun) stopSpeaking(); });
    }).catch(function (err) {
      if (run !== speechRun) return;
      stopSpeaking();
      btn.textContent = "Voice failed — tap to retry"; btn.title = err && err.message ? err.message : String(err);
      if (/timed out/i.test(err && err.message ? err.message : String(err))) setVoiceDiag("Listen: generate timed out after 30 seconds, so playback stopped instead of hanging on Stop.");

}
function addPictureBubble(dataUrl, caption) {
  const div = document.createElement("div");
  div.className = "pic-bubble";
  const img = document.createElement("img");
  img.src = dataUrl;
  img.alt = "Attached picture";
  div.appendChild(img);
  if (caption) {
    const cap = document.createElement("div");
    cap.className = "cap";
    cap.textContent = caption;
    div.appendChild(cap);

}
function friendlyError(status) {
  if (status === 429) return "Too many requests right now \u2014 please slow down and try again in a bit.";
  if (status === 503) return "The chat service is temporarily unavailable (it may have hit its daily budget). Try again later.";
  if (status === 400) return "That request was rejected. Try a shorter message or a smaller picture.";
  return "Something went wrong reaching Tiny Tim. Please try again.";
}
async function send() {
  stopSpeaking();
  setTinyAvatar("thinking");
  const text = inputEl.value.trim();
  if ((!text && !pendingImages.length) || sendBtn.disabled) { setTinyAvatar("normal"); return; }
  const images = pendingImages.slice();
  pendingImages = [];
  multiNote = "";
  renderThumbs();
  inputEl.value = "";
  autoresize();
  let content;
  if (images.length) {
    const parts = [];
    if (text) parts.push({ type: "text", text: text });
    images.forEach(function (url) { parts.push({ type: "image_url", image_url: { url: url } }); });
    content = parts;
  } else {
    content = text;
  }
  history.push({ role: "user", content: content });
  if (images.length) images.forEach(function (url, i) { addPictureBubble(url, i === 0 ? text : ""); });
  else addBubble("out", "<p>" + esc(text).replace(/\n/g, "<br>") + "</p>");
  setStatus("working", "Thinking\u2026");
  sendBtn.disabled = true;
  try {
    const payload = {
      model: MODEL,
      messages: [{ role: "system", content: SYSTEM_PROMPT }].concat(history.slice(-HISTORY_LIMIT)),
      temperature: 0.7,
      max_tokens: 1024
    };
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("http" + res.status);
    const data = await res.json();
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    const reply = msg && msg.content;
    if (typeof reply !== "string" || !reply.trim()) throw new Error("empty");
    history.push({ role: "assistant", content: reply });
    addSpeakButton(addBubble("in", md(reply)), reply);
  } catch (err) {
    const m = /^http(\d+)$/.exec(String(err && err.message));
    addBubble("in", "<p>" + esc(friendlyError(m ? +m[1] : 0)) + "</p>", "error");
  } finally {
    setTinyAvatar("normal");
    setStatus("idle", "Ready");
    sendBtn.disabled = false;
    inputEl.focus();
  }
}
function closeAttachMenu() { attachMenu.hidden = true; }
/* Attach-fix (2026-11-04): one menu, one picker, one click.
   The double menu was NOT two custom menus: this page has exactly one
   custom menu. On iOS, a plain <input type="file" accept="image/*"> with no
   capture attribute opens Apple's own source sheet (Take Photo / Photo
   Library / Choose File) AFTER the custom menu choice, because the custom
   menu only programmatically .click()s that input. Camera already bypasses
   the sheet via capture="environment". Library / Choose File have no HTML
   attribute that forces iOS straight into Photos and suppresses its sheet,
   so page code alone cannot guarantee zero second sheet on iOS for those
   two choices -- Evan's phone proof after hosting is still required.
   What this fix does guarantee in page code: (a) the custom menu is the
   only page menu, (b) a menu choice clicks exactly one input, exactly once,
   synchronously inside the tap handler (no timer/async, so the click keeps
   its user-gesture trust), (c) no second picker can fire while one is open,
   and (d) a cancelled picker releases the guard so + works again. */
var pickInFlight = false;
function endPick() { pickInFlight = false; }
function pickFromMenu(input) {
  if (pickInFlight) return;
  pickInFlight = true;
  closeAttachMenu();
  input.click(); /* synchronous: must stay in this tap handler */
}
attachBtn.addEventListener("click", function (e) { e.stopPropagation(); if (pickInFlight) return; attachMenu.hidden = !attachMenu.hidden; });
document.addEventListener("click", function (e) { if (!attachMenu.hidden && !attachMenu.contains(e.target) && e.target !== attachBtn) closeAttachMenu(); });
libraryBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); pickFromMenu(fileInput); });
cameraBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); pickFromMenu(cameraInput); });
chooseFileBtn.addEventListener("click", function (e) { e.stopPropagation(); e.preventDefault(); pickFromMenu(chooseFileInput); });
/* Release the guard on every picker outcome: chosen file, cancelled sheet,
   or focus returning to the page after a cancelled sheet (iOS does not

window.addEventListener("focus", endPick);
["fileInput", "cameraInput", "chooseFileInput"].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener("cancel", endPick);
});
function handlePickedFile(pickedInput) {
  const picked = pickedInput.files ? Array.prototype.slice.call(pickedInput.files) : [];
  pickedInput.value = "";
  if (!picked.length) return;
  const room = Math.max(0, 3 - pendingImages.length);
  if (picked.length > room) multiNote = "Up to 3 pictures at a time \u2014 extra pictures were not added.";
  const files = picked.slice(0, room);
  (function processNext(i) {
    if (i >= files.length) { renderThumbs(); return; }
    const reader = new FileReader();
    reader.onload = function () {
      const img = new Image();
      img.onload = function () {
        const maxDim = 1024;
        let w = img.naturalWidth, h = img.naturalHeight;
        const scale = Math.min(1, maxDim / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.85, url = c.toDataURL("image/jpeg", q);
        while (url.length > 2000000 && q > 0.4) { q -= 0.15; url = c.toDataURL("image/jpeg", q); }

function renderThumbs() {

    d.className = "thumb";
